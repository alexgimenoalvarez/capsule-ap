*{box-sizing:border-box}body{margin:0;background:#dfe4ef;color:var(--ink);-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7958e8;outline-offset:3px}.app-shell{max-width:540px;margin:0 auto;min-height:100svh;background:var(--bg);position:relative;box-shadow:0 2px 80px rgba(21,28,48,.09)}#app{min-height:100svh;padding-bottom:110px}.top{background:var(--navy);padding:calc(28px + env(safe-area-inset-top)) 24px 28px;color:#fff;border-radius:0 0 28px 28px}.brand{display:flex;align-items:center;gap:10px;letter-spacing:.06em;font-size:13px;font-weight:850}.brand-mark{background:var(--lime);color:var(--navy);height:34px;width:34px;display:grid;place-items:center;border-radius:11px;font-size:19px;font-weight:950;letter-spacing:-1px}.brand-light{color:#9ca6c1;font-weight:600;letter-spacing:0;margin-left:auto;font-size:11px}.hero{padding-top:30px;display:grid;gap:9px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.19em;font-weight:900;color:#bbafed}.hero h1{font-size:32px;line-height:1.13;letter-spacing:-.055em;font-weight:830;margin:0;max-width:420px}.hero p{font-size:14px;line-height:1.55;color:#bbc4d7;margin:0;max-width:390px}.hero h1 em{font-style:normal;color:var(--lime)}.hero-stats{display:flex;gap:10px;align-items:stretch;padding-top:12px}.stat-pill{display:flex;align-items:center;gap:9px;color:#e9ecf6;font-size:12px;border:1px solid #35405b;padding:10px 12px;border-radius:13px}.stat-pill strong{font-size:17px;color:#fff}.content{padding:25px 22px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 14px}.section-heading h2{margin:0;font-size:19px;letter-spacing:-.04em}.subtle{font-size:12px;color:var(--muted)}.section-heading .subtle{font-weight:700}.feature{color:#fff;background:linear-gradient(130deg,#6c4bd0,#8469e7);border-radius:25px;padding:22px 20px;display:grid;gap:12px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.feature:before{content:"";position:absolute;right:-65px;top:-75px;width:200px;height:200px;border:1px solid #b4a2fe67;border-radius:50%;box-shadow:0 0 0 30px #b4a2fe12,0 0 0 70px #b4a2fe12}.feature>*{position:relative}.feature .eyebrow{color:#dcd4ff}.feature h3{font-size:23px;line-height:1.18;letter-spacing:-.04em;margin:0;max-width:310px}.feature p{font-size:13px;color:#efe9ff;line-height:1.55;max-width:370px;margin:0}.feature-actions{display:flex;align-items:center;gap:12px;justify-content:space-between}.feature-duration{color:#e8defe;font-size:12px}.btn{border:0;border-radius:14px;padding:14px 17px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:7px;justify-content:center;transition:transform .14s}.btn:active{transform:scale(.97)}.btn-white{background:var(--white);color:#442b92}.btn-dark{background:var(--navy);color:white}.btn-outline{background:white;color:var(--ink);border:1px solid #dedfec}.btn-lime{background:var(--lime);color:var(--navy)}.btn-block{display:flex;width:100%;padding:17px}.spacing{height:24px}.tiny{font-size:11px;color:var(--muted)}.list{display:grid;gap:11px}.lesson-row{display:flex;align-items:center;gap:13px;width:100%;border:1px solid #e9ebf3;background:#fff;padding:15px;border-radius:19px;text-align:left;box-shadow:0 2px 9px #18213a05}.course-icon{width:48px;height:48px;flex-shrink:0;background:#f0ebff;border-radius:15px;display:grid;place-items:center;color:#6849d1;font-weight:900;font-size:22px}.course-icon.blue{background:#eaf1ff;color:#436db3}.course-icon.green{background:#e6f7ed;color:#188062}.row-main{min-width:0;flex:1;display:grid;gap:4px}.row-main h3{font-size:14px;letter-spacing:-.015em;margin:0;font-weight:800}.row-main p{font-size:11px;color:var(--muted);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-status{font-size:11px;font-weight:850;color:#9a9faf;white-spac ion h2{font-size:16px}.reader-section .example{background:#f3f0ff;border-left:3px solid #9679e7;padding:13px 14px;border-radius:0 10px 10px 0;color:#554686;font-size:13px;line-height:1.65;margin-top:12px}.source{border:1px solid #e4e7f0;border-radius:17px;padding:15px;background:#fff;margin:13px 0;font-size:11px;line-height:1.5;color:#6d7487}.source b{display:block;color:var(--ink);margin-bottom:3px}.focus-card{background:#e9f6cf;border:1px solid #deeeae;padding:16px;border-radius:18px;margin:14px 0 18px}.focus-card h3{font-size:14px;margin:0 0 8px}.focus-card ul{margin:0;padding-left:18px;font-size:13px;line-height:1.8}.quiztop{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:15px;font-size:12px;font-weight:850;color:#626b81}.progress-bar{height:7px;background:#e6e8f0;border-radius:20px;overflow:hidden;margin-bottom:24px}.progress-bar>span{display:block;background:#8262e0;height:100%;border-radius:20px;transition:width .25s}.question{font-size:22px;line-height:1.3;letter-spacing:-.045em;margin:0 0 12px}.hint{font-size:12px;color:#8991a4;margin:0 0 19px}.options{display:grid;gap:10px;margin-bottom:15px}.option{display:flex;gap:11px;align-items:flex-start;padding:14px 15px;border:1.5px solid #e4e6ef;border-radius:16px;background:white;text-align:left;min-height:58px;color:#343c53;font-size:14px;line-height:1.5;width:100%}.option.selected{border-color:#8a6ee6;background:#f5f0ff}.option.correct{border-color:#51b894;background:#eaf9f0}.option.wrong{border-color:#e9a7aa;background:#fff0f1}.bubble{border:1.5px solid #ccd1df;border-radius:6px;width:20px;height:20px;flex:0 0 20px;display:grid;place-items:center;font-size:12px;color:white;margin-top:0}.option.selected .bubble{background:#7c5ddd;border-color:#7c5ddd}.option.correct .bubble{background:#159669;border-color:#159669}.option.wrong .bubble{background:#c85160;border-color:#c85160}.feedback{border-radius:19px;padding:16px;margin:16px 0;background:#fff;border:1px solid #e6e9f0}.feedback h3{margin:0 0 8px;font-size:15px}.feedback p{margin:0 0 10px;color:#556078;line-height:1.55;font-size:13px}.feedback-item{display:grid;gap:5px;padding:9px 0;border-top:1px solid #eff0f5}.feedback-item:first-child{border:0}.mini-label{font-size:11px;font-weight:850;color:#6d56b4}.pill-theory{background:#f2eeff;border-radius:13px;color:#46368c;padding:12px;font-size:13px;line-height:1.55}.pill-theory strong{display:block;font-size:11px;letter-spacing:.07em;margin-bottom:5px}.score{background:#fff;border-radius:24px;padding:27px 18px;text-align:center;margin:15px 0;border:1px solid #e8eaf1}.score-circle{height:128px;width:128px;border-radius:50%;display:grid;place-items:center;margin:5px auto 15px;border:10px solid #e8dfff;background:#f6f2ff;font-size:35px;letter-spacing:-.065em;font-weight:900;color:#6849c5}.score h2{margin:0 0 5px;letter-spacing:-.035em}.score p{color:#798196;font-size:13px;line-height:1.55}.score small{color:#9c8fb8}.note-area{resize:vertical;min-height:94px;width:100%;border:1px solid #dce0ea;border-radius:15px;padding:13px;background:#fff;font-size:13px;color:#1c2541;line-height:1.5}.search{display:flex;align-items:center;gap:7px;border:1px solid #e2e5ee;border-radius:15px;padding:0 15px;background:white;margin:0 0 14px}.search input{border:0;background:none;height:48px;flex:1;outline:0;font-size:14px;min-width:0}.search:focus-within{outline:2px solid #d6c6ff}.filter{border:0;padding:10px 13px;border-radius:12px;background:white;color:#7a8193;font-weight:750;font-size:12px;white-space:nowrap}.filter.on{background:#7858df;color:white}.filterstrip{display:flex;gap:6px;overflow:auto;margin:10px 0 17px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:white;border:1px solid #e6e9f1;border-radius:18px;padding:18px}.metric b{font-size:28px;letter-spacing:-.04em}.metric p{margin:3px 0 0;font-size:12px;color:#838ba1}.history{padding:14px 0;border-bottom:1px solid #e6e8ef;font-size:13px;display:flex;gap:12px;justify-content:space-between}.history:last-child{border:0}.entry{background:#fff;border:1px solid #e8eaf3;border-radius:19px;padding:17px;margin:12px 0}.entry h3{font-size:15px;margin:0 0 7px}.entry p{font-size:12px;line-height:1.6;color:#697289;margin:0 0 13px}.filebox{padding:12px;background:#f4f5f9;border-radius:12px;font-size:12px;margin-bottom:13px;overflow-wrap:anywhere}.alert{border-radius:13px;padding:11px 12px;font-size:12px;line-height:1.5;background:#fff8e2;color:#6d570e}.disclaimer{font-size:10px;line-height:1.6;color:#9196a3;margin-top:22px;text-align:center}.empty{padding:25px;text-align:center;color:#7b8496;font-size:13px}.notice{position:fixed;z-index:99;bottom:97px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 35px);background:#212c46;color:#fff;border-radius:13px;padding:12px 17px;font-size:12px;box-shadow:0 8px 22px #10182d33}.quick-actions{display:flex;gap:9px;flex-wrap:wrap}.quick-actions .btn{flex:1}.inline-badge{font-size:10px;background:#e8f6dd;color:#44743a;padding:5px 7px;border-radius:999px;font-weight:850}.inline-badge.warn{background:#ffecc7;color:#927003}.lock{font-size:11px;color:#a3a9b8}@media(min-width:650px){.app-shell{margin:24px auto;border-radius:30px;overflow:hidden;min-height:90vh}.top{padding-top:35px}.inside-top{padding-top:30px}.bottom-nav{bottom:24px;border-radius:0 0 30px 30px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media (max-width:365px){.hero h1{font-size:29px}.content{padding:20px 16px}.stat-pill{padding:8px}.brand-light{font-size:10px}}
