  <script>
window.CAPSULE_SEED = [{"id":"etat","title":"L’État, la souveraineté et l’État de droit","subject":"Droit constitutionnel","icon":"scale","semester":"S5","minutes":10,"source":{"file":"Cours_Droit_constitutionnel.pdf","pages":"15–21 (chapitre I : notions de compréhension, non priorité de mémorisation selon p. 13)"},"sections":[{"title":"1 · Reconnaître un État","body":"Un État est une organisation politique et juridique caractérisée par trois éléments généralement étudiés ensemble : une population, un territoire et une autorité publique exerçant un pouvoir effectif. Une nation n’est pas nécessairement un État : elle relève plutôt d’un sentiment d’appartenance partagé. La population est l’ensemble des personnes vivant sous la juridiction de l’État ; le territoire délimite l’espace où le pouvoir s’exerce ; le gouvernement effectif désigne l’existence d’institutions capables de décider et de faire appliquer leurs décisions.","example":"Une collectivité comme la région Nouvelle-Aquitaine possède un territoire et des habitants, mais elle n’a pas une souveraineté étatique : elle agit dans le cadre de la République française."},{"title":"2 · La personnalité morale et la souveraineté","body":"L’État est une personne morale : il dispose de droits, d’obligations et d’un patrimoine distincts de ceux de ses dirigeants. Le titulaire temporaire d’une fonction ne se confond donc pas avec l’institution. Cette continuité explique pourquoi une alternance politique n’efface pas, par elle-même, les engagements juridiques de l’État. La souveraineté désigne quant à elle le caractère suprême du pouvoir étatique dans son ordre juridique. Elle doit être articulée aujourd’hui avec les engagements internationaux et européens, sans confondre souveraineté et liberté d’agir sans règle.","example":null},{"title":"3 · L’État de droit et les contre-pouvoirs","body":"L’État de droit signifie que l’exercice du pouvoir est encadré par des règles contrôlables. Une administration ne peut se contenter d’invoquer l’intérêt général pour écarter les droits fondamentaux ou ignorer une loi. Les recours devant des juridictions indépendantes, la séparation des pouvoirs, la légalité et la hiérarchie des normes sont des garanties centrales. La formule « l’État est soumis au droit » est donc plus précise que « l’État fait le droit ». Une mesure politique peut être populaire tout en étant juridiquement irrégulière.","example":"Un arrêté municipal portant atteinte à une liberté peut être contesté devant le juge administratif, sous réserve des conditions du recours."},{"title":"4 · L’État unitaire","body":"La France est un État unitaire : il n’existe qu’un seul ordre constitutionnel étatique. La décentralisation confie des compétences à des collectivités dotées d’une personnalité juridique propre ; la déconcentration confie la mise en œuvre de décisions étatiques à des représentants ou services locaux de l’État. La distinction est fondamentale : un maire agit parfois au nom de la commune, parfois au nom de l’État ; le préfet, lui, représente l’État dans le département.","example":null}],"takeaway":["État = population + territoire + autorité effective","Personnalité morale ≠ personne du dirigeant","État de droit = pouvoir soumis à des règles et à un juge"],"questions":[{"text":"Quels sont les trois éléments classiques de l’État ?","choices":["Nation, religion, langue","Population, territoire, gouvernement effectif","Parlement, commune, budget"],"correct":[1],"reason":["Une nation peut exister sans disposer d’un État.","Exact : ces trois éléments caractérisent classiquement l’État.","Ce sont des institutions ou éléments possibles, pas les critères cumulatifs."],"pill":"La nation renvoie à un sentiment d’appartenance ; l’État à une organisation juridique.","multi":false},{"text":"Quelles propositions décrivent l’État de droit ?","choices":["L’administration respecte la hiérarchie des normes.","Le pouvoir peut écarter une loi s’il estime agir efficacement.","Un contrôle par des juridictions indépendantes est essentiel."],"correct":[0,2],"reason":["Oui, l’administration est tenue par la légalité.","Non, l’efficacité n’annule pas les garanties juridiques.","Oui, le contrôle juridictionnel évite l’arbitraire."],"pill":"État de droit : légalité + contrôle indépendant + respect des droits.","multi":true},{"text":"Le préfet de département illustre principalement…","choices":["La déconcentration","La décentralisation","Le fédéralisme"],"correct":[0],"reason":["Oui : il agit comme représentant territorial de l’État.","La décentralisation concerne les collectivités autonomes dans leurs compétences.","La France n’est pas un État fédéral."],"pill":"Déconcentration = même personne morale « État » ; décentralisation = collectivité distincte.","multi":false},{"text":"Un changement de président met-il fin à la personnalité juridique de l’État ?","choices":["Oui, car le pouvoir appartient au président.","Non, car l’État est une personne morale continue."],"correct":[1],"reason":["Le président est une institution ou un titulaire de fonction, pas la totalité de l’État.","Exact : l’État survit au renouvellement des gouvernants."],"pill":"Personnalité morale : continuité des engagements et des institutions.","multi":false}]},{"id":"revision","title":"Comment réviser la Constitution ?","subject":"Droit constitutionnel","icon":"book","semester":"S5","minutes":10,"source":{"file":"Cours_Droit_constitutionnel.pdf","pages":"25–31 (chapitre II, notamment section 4 p. 28)"},"sections":[{"title":"1 · Une Constitution rigide","body":"La Constitution du 4 octobre 1958 est une norme fondamentale qui organise les pouvoirs publics. Sa modification suit une procédure renforcée : on ne peut pas, en principe, la transformer par une simple loi ordinaire. On parle de Constitution « rigide ». Il faut distinguer la révision formelle du texte et l’évolution de sa pratique politique : une nouvelle manière pour les acteurs d’exercer leurs compétences ne modifie pas nécessairement la lettre de la Constitution.","example":null},{"title":"2 · L’initiative et le vote","body":"L’article 89 distingue le projet de révision, initié par le président de la République sur proposition du Premier ministre, et la proposition de révision, issue de parlementaires. Le texte doit être voté en termes identiques par l’Assemblée nationale et le Sénat : aucune assemblée ne peut être contournée à ce stade. Cette exigence d’accord distingue la révision constitutionnelle d’une procédure législative ordinaire où l’Assemblée nationale peut parfois avoir le dernier mot.","example":"Si les deux chambres adoptent des textes différents, la révision fondée sur l’article 89 ne peut pas continuer vers l’approbation finale tant que le texte n’est pas identique."},{"title":"3 · L’approbation définitive","body":"Une fois le texte adopté dans les mêmes termes, la voie normale d’approbation est le référendum. Toutefois, pour un projet de révision, le président peut choisir de convoquer le Parlement en Congrès ; l’approbation exige alors une majorité des trois cinquièmes des suffrages exprimés. Cette voie de Congrès ne s’applique pas aux propositions de révision d’origine parlementaire. À mémoriser : « projet = Congrès possible ; proposition = référendum ». La majorité des trois cinquièmes porte sur les suffrages exprimés, et non sur les membres inscrits.","example":null},{"title":"4 · Les limites","body":"L’article 89 interdit d’engager ou poursuivre la procédure de révision lorsqu’il est porté atteinte à l’intégrité du territoire. Il protège aussi la forme républicaine du gouvernement contre la révision. Ces limites constituent un rappel central : même le pouvoir constituant dérivé n’est pas entièrement libre. Pour répondre à une QRC, expose la procédure avant les limites, puis illustre par un cas court.","example":null}],"takeaway":["Article 89 : double vote identique","Projet présidentiel : Congrès possible, majorité 3/5","Forme républicaine non révisable"],"questions":[{"text":"Le Congrès peut être choisi pour approuver…","choices":["Un projet de révision","Une proposition de révision","N’importe quelle loi ordinaire"],"correct":[0],"reason":["Correct : l’article 89 prévoit ce choix pour un projet.","Non : une proposition suit la voie référendaire.","Le Congrès de l’article 89 est une procédure constitutionnelle, pas ordinaire."],"pill":"Retiens : projet = Congrès envisageable ; proposition = référendum.","multi":false},{"text":"Que doivent d’abord faire les deux chambres ?","choices":["Adopter le texte en termes identiques","Voter chacune un texte librement différent","Laisser le Sénat se prononcer seulement pour avis"],"correct":[0],"reason":["Oui : la navette doit parvenir à un texte identique.","Non : l’identité est indispensable.","Non : le Sénat dispose d’un pouvoir égal pour l’adoption de la révision."],"pill":"L’accord des deux assemblées est incontournable à l’article 89.","multi":false},{"text":"Quelle majorité est exigée au Congrès ?","choices":["Majorité absolue des députés","Trois cinquièmes des suffrages exprimés","Deux tiers des sénateurs"],"correct":[1],"reason":["Elle ne correspond pas à l’article 89.","Correct : majorité qualifiée de trois cinquièmes.","Ce n’est pas le seuil prévu."],"pill":"Attention à la différence entre « exprimés » et « inscrits ».","multi":false},{"text":"Quelles limites la Constitution pose-t-elle à la révision ?","choices":["La forme républicaine du gouvernement","Toute modification de la durée du mandat présidentiel","Une atteinte à l’intégrité du territoire pendant la procédure"],"correct":[0,2],"reason":["Oui, la forme républicaine ne peut être révisée.","Non, la durée du mandat a été modifiée notamment en 2000.","Oui, l’article 89 impose cette limite de circonstance."],"pill":"L’article 89 comporte des règles de procédure ET des limites matérielles ou circonstancielles.","multi":true}]},{"id":"president","title":"Président : élection, mandat, rôle","subject":"Droit constitutionnel","icon":"landmark","semester":"S5","minutes":10,"source":{"file":"Cours_Droit_constitutionnel.pdf","pages":"33–41 (chapitre III et chapitre IV section 1)"},"sections":[{"title":"1 · Une élection directe","body":"Depuis la réforme de 1962, le président de la République est élu au suffrage universel direct. Le scrutin est majoritaire à deux tours : si un candidat obtient la majorité absolue des suffrages exprimés au premier tour, il est élu ; sinon un second tour départage les deux candidats arrivés en tête (sauf hypothèses exceptionnelles). Le vote blanc ne constitue pas un suffrage exprimé pour calculer cette majorité. Le caractère direct de l’élection donne au président une forte légitimité démocratique mais ne le dispense jamais de la Constitution.","example":null},{"title":"2 · Le quinquennat","body":"Depuis la réforme approuvée en 2000, le mandat présidentiel est de cinq ans et non plus sept. L’élection présidentielle et les élections législatives ont été progressivement rapprochées dans le calendrier, ce qui a favorisé certaines situations de concordance des majorités. Il ne s’agit pourtant pas d’une garantie : le résultat des élections dépend des électeurs. La limitation à deux mandats consécutifs a été introduite par la révision constitutionnelle de 2008 (article 6).","example":null},{"title":"3 · Article 5 : arbitrer, garantir, veiller","body":"L’article 5 présente le président comme garant du respect de la Constitution ; il assure, par son arbitrage, le fonctionnement régulier des pouvoirs publics et la continuité de l’État. Il est aussi garant de l’indépendance nationale, de l’intégrité du territoire et du respect des traités. Dans une QRC, citer un article précis vaut mieux qu’attribuer au président une compétence générale imprécise.","example":null},{"title":"4 · Un président puissant, mais pas seul","body":"La Ve République associe un président de la République à un gouvernement responsable devant le Parlement. Le président nomme le Premier ministre (article 8), tandis que le gouvernement détermine et conduit la politique de la nation (article 20). La pratique politique varie selon la configuration des majorités, ce qui conduit à distinguer présidentialisme et cohabitation, sans modifier les règles écrites de base.","example":"Lorsqu’une majorité parlementaire soutient un Premier ministre d’une autre sensibilité que le président, la répartition politique des rôles change, mais les articles 5, 8 et 20 restent applicables."}],"takeaway":["Scrutin majoritaire à deux tours","Quinquennat ; au maximum 2 mandats consécutifs","Article 5 = arbitrage et garanties"],"questions":[{"text":"Quelle est aujourd’hui la durée du mandat présidentiel ?","choices":["4 ans","5 ans","7 ans"],"correct":[1],"reason":["Ce n’est pas la durée prévue par l’article 6.","Oui : quinquennat.","C’était l’ancienne durée du mandat."],"pill":"Quinquennat depuis la révision de 2000.","multi":false},{"text":"Quel article définit le rôle d’arbitre et de garant du président ?","choices":["Article 5","Article 20","Article 49"],"correct":[0],"reason":["Oui : article 5.","Article 20 : politique de la nation conduite par le gouvernement.","Article 49 : responsabilité du gouvernement devant l’Assemblée."],"pill":"L’article 5 est la référence de base pour le statut d’arbitre.","multi":false},{"text":"Quelles propositions sont justes ?","choices":["Le président est élu au suffrage universel direct.","Le gouvernement est responsable devant le Parlement.","Le président peut, sans limite, modifier la Constitution par décret."],"correct":[0,1],"reason":["Oui, c’est la règle depuis la réforme de 1962.","Oui, principe du régime parlementaire de la Ve République.","Non, la révision a sa propre procédure."],"pill":"Légitimité électorale ≠ pouvoir juridiquement illimité.","multi":true},{"text":"La cohabitation entraîne-t-elle l’abrogation de l’article 20 ?","choices":["Oui","Non"],"correct":[1],"reason":["La Constitution reste en vigueur pendant une cohabitation.","Correct : la pratique change, le texte demeure."],"pill":"Article 20 : le gouvernement détermine et conduit la politique de la nation.","multi":false}]},{"id":"pouvoirs","title":"Pouvoirs propres, contreseing, dissolution","subject":"Droit constitutionnel","icon":"gavel","semester":"S5","minutes":10,"source":{"file":"Cours_Droit_constitutionnel.pdf","pages":"50–65 (chapitre IV, sections 3 à 5)"},"sections":[{"title":"1 · Que signifie « pouvoir propre » ?","body":"En principe, les actes du président sont contresignés par le Premier ministre et, le cas échéant, les ministres responsables. L’article 19 énumère les exceptions : certaines compétences sont donc exercées sans contreseing. Cette différence est capitale dans les examens de droit constitutionnel. Le contreseing n’est pas une simple signature décorative : il traduit un mécanisme de répartition des responsabilités au sein du pouvoir exécutif.","example":null},{"title":"2 · Des exemples à retenir","body":"Parmi les pouvoirs propres figurent notamment la nomination du Premier ministre (article 8, premier alinéa), le recours au référendum selon l’article 11, la dissolution de l’Assemblée nationale (article 12) et les pouvoirs exceptionnels de l’article 16, sous réserve de leurs conditions respectives. Le président doit consulter le Premier ministre et les présidents des assemblées avant une dissolution ; cette consultation ne constitue pas une autorisation préalable. En revanche, de nombreuses autres décisions présidentielles restent soumises au contreseing.","example":null},{"title":"3 · Dissoudre n’est pas réviser","body":"La dissolution prévue par l’article 12 met fin par anticipation au mandat collectif des députés et provoque de nouvelles élections législatives. Elle ne dissout pas le Sénat, ne modifie pas la Constitution et n’entraîne pas à elle seule le départ du Premier ministre. De nouvelles élections doivent se tenir vingt à quarante jours après la dissolution. Une nouvelle dissolution ne peut intervenir dans l’année qui suit ces élections. Conserver ces distinctions t’aidera à éviter les pièges des QCM.","example":null},{"title":"4 · Savoir répondre à une QRC","body":"Sujet-type : « Le président peut-il décider seul la dissolution ? ». Commence par identifier l’article 12 et l’absence de contreseing grâce à l’article 19 ; distingue ensuite les consultations obligatoires de l’accord de leurs destinataires ; termine en rappelant les conséquences électorales et la limite d’un an. La réponse attendue n’est ni « il fait tout seul » ni « il doit obtenir l’accord du Sénat », mais une analyse structurée des conditions et des effets.","example":null}],"takeaway":["Article 19 : liste des exceptions au contreseing","Article 12 : dissolution de l’Assemblée nationale","Consultation obligatoire ≠ autorisation"],"questions":[{"text":"Quelle disposition permet la dissolution de l’Assemblée nationale ?","choices":["Article 12","Article 49 al. 3","Article 89"],"correct":[0],"reason":["Oui : article 12.","Article 49-3 concerne la responsabilité sur un texte, pas la dissolution.","Article 89 concerne la révision de la Constitution."],"pill":"Dissolution (art. 12) ≠ engagement de responsabilité (art. 49) ≠ révision (art. 89).","multi":false},{"text":"Que dissout le président par l’article 12 ?","choices":["L’Assemblée nationale","Le Sénat","Le Conseil constitutionnel"],"correct":[0],"reason":["Exact.","Le Sénat n’est pas dissous par l’article 12.","Le Conseil constitutionnel n’est pas une assemblée législative dissoute ainsi."],"pill":"Seule l’Assemblée nationale est concernée par la dissolution.","multi":false},{"text":"Avant une dissolution, il doit consulter…","choices":["Le Premier ministre","Les présidents des assemblées","Tous les maires de France"],"correct":[0,1],"reason":["Oui, consultation prévue à l’article 12.","Oui, les présidents des assemblées doivent être consultés.","Ce n’est pas une condition constitutionnelle."],"pill":"Consulter une autorité ne signifie pas obtenir son accord.","multi":true},{"text":"Un pouvoir propre signifie…","choices":["Une compétence présidentielle sans contreseing","Un pouvoir qui ne connaît aucune condition","Un droit du président de rédiger la loi seul"],"correct":[0],"reason":["C’est le sens juridique à retenir.","Un pouvoir propre reste encadré par la Constitution.","La fonction législative n’est pas transférée au président par cette formule."],"pill":"Pense à l’article 19 avant de classer un acte comme « propre ».","multi":false}]},{"id":"gouvernement","title":"Premier ministre et gouvernement","subject":"Droit constitutionnel","icon":"users","semester":"S5","minutes":10,"source":{"file":"Cours_Droit_constitutionnel.pdf","pages":"67–79 (chapitre V, sélectionner sections indiquées p. 13)"},"sections":[{"title":"1 · Formation du gouvernement","body":"Le président nomme le Premier ministre (article 8). Les autres membres du gouvernement sont nommés par le président sur proposition du Premier ministre. En droit, la nomination est présidentielle ; en pratique, la composition et la stabilité d’un gouvernement dépendent aussi de l’équilibre des forces parlementaires. Cette dimension politique est importante, mais elle ne remplace pas la règle juridique.","example":null},{"title":"2 · Article 20 : la direction politique","body":"L’article 20 précise que le gouvernement détermine et conduit la politique de la nation. Il dispose de l’administration et de la force armée et est responsable devant le Parlement selon les articles 49 et 50. Cette responsabilité ne signifie pas que le Parlement dirige lui-même l’administration : elle signifie qu’il existe des mécanismes constitutionnels pour mettre en cause le gouvernement et, dans certaines situations, le contraindre à démissionner.","example":null},{"title":"3 · Article 21 : le Premier ministre","body":"Le Premier ministre dirige l’action du gouvernement, assure l’exécution des lois et exerce, sous réserve des compétences présidentielles, le pouvoir réglementaire. Il est responsable de la défense nationale selon l’article 21. On oppose souvent trop vite « président = tout » et « Premier ministre = exécutant » : dans une copie, cite les textes et distingue ensuite le fonctionnement réel selon les majorités.","example":"Un décret réglementaire du Premier ministre illustre l’exécution des lois, mais il existe aussi des décrets délibérés en Conseil des ministres qui sont signés par le président."},{"title":"4 · Une question de méthode","body":"Pour une QRC sur les relations président–Premier ministre, construis un raisonnement en trois étapes : (1) les textes, articles 8, 20 et 21 ; (2) les moyens politiques, confiance et majorité parlementaire ; (3) les variations de pratique, notamment la cohabitation. Évite de confondre responsabilité politique du gouvernement et responsabilité du président.","example":null}],"takeaway":["Art. 8 : nomination","Art. 20 : gouvernement conduit la politique nationale","Art. 21 : Premier ministre dirige l’action gouvernementale"],"questions":[{"text":"Selon l’article 20, qui détermine et conduit la politique de la nation ?","choices":["Le gouvernement","Le Sénat","Le Conseil constitutionnel"],"correct":[0],"reason":["Exact : le gouvernement.","Le Sénat participe au Parlement mais ne conduit pas l’action gouvernementale.","Le Conseil constitutionnel contrôle des normes, il ne gouverne pas."],"pill":"Art. 20 = Gouvernement ; art. 21 = Premier ministre.","multi":false},{"text":"Qui nomme le Premier ministre ?","choices":["Le président de la République","Le président du Sénat","Les députés par élection directe"],"correct":[0],"reason":["Oui : article 8.","Ce n’est pas sa compétence.","Les députés peuvent mettre en jeu la responsabilité gouvernementale mais ne l’élisent pas directement."],"pill":"Nomination présidentielle ; responsabilité gouvernementale distincte.","multi":false},{"text":"Quelles attributions relèvent du Premier ministre ?","choices":["Diriger l’action du gouvernement","Assurer l’exécution des lois","Réviser la Constitution par simple arrêté"],"correct":[0,1],"reason":["Oui, article 21.","Oui, article 21.","Non, la révision constitutionnelle est encadrée par l’article 89."],"pill":"Article 21 : direction, exécution des lois et pouvoir réglementaire.","multi":true},{"text":"Le gouvernement est-il politiquement responsable devant le Parlement ?","choices":["Oui","Non"],"correct":[0],"reason":["Oui, selon les conditions des articles 49 et 50.","Les mécanismes des articles 49 et 50 montrent le contraire."],"pill":"Responsabilité politique : un marqueur du régime parlementaire.","multi":false}]},{"id":"politique","title":"Qu’est-ce qu’une politique publique ?","subject":"Politiques publiques","icon":"route","semester":"S5","minutes":10,"source":{"file":"64L04TEWB0127_Cours_PolitiquesPubliques.pdf","pages":"4–7 (définitions, administrations publiques et typologies)"},"sections":[{"title":"1 · Qui, quoi, pourquoi ?","body":"Une politique publique n’est pas seulement une annonce de ministre ni une décision isolée. On peut la comprendre comme un ensemble coordonné de moyens mobilisés par des autorités publiques en vue d’objectifs dans un domaine donné. Pour l’analyser, pose systématiquement trois questions : QUI intervient (État, collectivités, agences, sécurité sociale) ? QUOI est mis en œuvre (loi, budget, service, subvention, campagne, contrôle) ? POURQUOI (objectif et problème à traiter) ? Ces trois questions évitent une description purement politique et obligent à identifier les instruments d’action.","example":null},{"title":"2 · Les administrations publiques","body":"La comptabilité nationale distingue trois sous-ensembles : les administrations publiques centrales (APUC), les administrations publiques locales (APUL) et les administrations de sécurité sociale (ASSO). La nature d’une politique publique ne se déduit pas du seul acteur qui parle : un programme de prévention sanitaire peut mobiliser une commune, une agence nationale et des organismes de Sécurité sociale. Il faut identifier les décideurs, les financeurs et les exécutants, qui peuvent être différents.","example":"Un programme contre le décrochage scolaire peut associer l’Éducation nationale, une collectivité territoriale et des associations subventionnées."},{"title":"3 · Des instruments variés","body":"Les pouvoirs publics peuvent intervenir par des obligations et sanctions, par des incitations financières, par la fourniture directe d’un service ou par l’information. Une même politique combine souvent plusieurs instruments : on peut, par exemple, agir sur la sécurité routière via réglementation, contrôle, aménagement de la voirie et campagnes de prévention. Un bon raisonnement ne juge pas seulement une mesure au regard des intentions affichées, mais demande si l’instrument choisi permet réellement d’atteindre le résultat.","example":null},{"title":"4 · Diagnostiquer l’action","body":"Pour comprendre l’efficacité d’une politique, distingue les moyens engagés (« inputs »), les réalisations administratives (« outputs ») et les effets observés sur le problème (« outcomes »). Construire dix équipements est une réalisation mesurable ; réduire les inégalités d’accès est un effet, plus difficile à établir. En dissertation ou QRC, la distinction entre objectif, instrument et résultat est très valorisable.","example":null}],"takeaway":["Qui ? Quoi ? Pourquoi ?","APUC, APUL, ASSO","Moyens ≠ réalisations ≠ effets"],"questions":[{"text":"Quel élément manque dans « Le gouvernement veut améliorer le logement » pour décrire une politique précise ?","choices":["Les instruments mis en œuvre","La couleur du logo du ministère","Le nom de chaque électeur"],"correct":[0],"reason":["Exact : les moyens rendent l’objectif opérationnel.","La communication n’est pas l’instrument essentiel à identifier.","Cet élément est sans rapport avec la définition."],"pill":"Politique publique = autorité + objectif + instruments cohérents.","multi":false},{"text":"Les collectivités territoriales appartiennent principalement aux…","choices":["APUL","APUC","ASSO"],"correct":[0],"reason":["Oui : administrations publiques locales.","APUC = centrales.","ASSO = sécurité sociale."],"pill":"APUC État ; APUL local ; ASSO social.","multi":false},{"text":"Quelles mesures peuvent être des instruments d’une politique publique ?","choices":["Une subvention","Un règlement obligatoire","Une campagne d’information"],"correct":[0,1,2],"reason":["Oui, instrument financier.","Oui, instrument normatif.","Oui, instrument informationnel."],"pill":"Une politique publique mobilise souvent plusieurs types d’instruments.","multi":true},{"text":"Créer dix permanences administratives est plutôt…","choices":["Une réalisation (output)","Une preuve immédiate d’impact social (outcome)","Une règle constitutionnelle"],"correct":[0],"reason":["Oui : on décrit ce qui a été produit par l’action.","L’impact doit être évalué séparément.","Ce n’est pas une règle constitutionnelle."],"pill":"Ne confonds pas action réalisée et amélioration réellement obtenue.","multi":false}]},{"id":"evaluation","title":"Mesurer les effets d’une politique","subject":"Politiques publiques","icon":"target","semester":"S5","minutes":10,"source":{"file":"64L04TEWB0127_Cours_PolitiquesPubliques.pdf","pages":"6–13 (types, rôle de l’État et instruments)"},"sections":[{"title":"1 · Le problème public et sa construction","body":"Une politique commence rarement par une évidence unanimement partagée. Il faut définir ce qui est considéré comme un problème public, déterminer quelles populations sont concernées et hiérarchiser les objectifs. Un même sujet peut être abordé sous des angles différents : l’absentéisme scolaire, par exemple, peut être traité par la prévention sociale, la santé, l’organisation éducative ou la sanction. Les choix de cadrage orientent les instruments disponibles.","example":null},{"title":"2 · Efficacité, efficience, équité","body":"L’efficacité demande si l’objectif visé est atteint. L’efficience demande si le résultat est obtenu avec un usage proportionné des ressources. L’équité interroge la distribution des effets entre les personnes ou territoires. Une politique peut être efficace mais coûteuse, ou efficiente mais socialement inégalitaire. Ces notions doivent être séparées dans un sujet d’examen : ce sont trois angles d’appréciation différents.","example":null},{"title":"3 · La comparaison pertinente","body":"Pour démontrer qu’une politique a eu un effet, il faut comparer la situation observée à un scénario crédible sans intervention. Une hausse de fréquentation après l’ouverture d’un service ne prouve pas à elle seule que l’ouverture est la cause de la hausse : saisonnalité, démographie ou communication peuvent contribuer au résultat. Sans étude statistique complexe, l’étudiant peut déjà mentionner ces facteurs confondants et distinguer corrélation et causalité.","example":"Si une médiathèque gagne 15 % de visiteurs après une rénovation, vérifie aussi l’évolution des horaires, des événements organisés et de la population desservie."},{"title":"4 · Restituer un diagnostic","body":"Un mini-diagnostic clair tient en quatre lignes : problème ciblé ; objectif mesurable ; moyen utilisé ; indicateur d’effet. Termine par un risque ou une limite. Cette grille est transférable à un sujet de politique du logement, d’accès aux soins, d’environnement ou de sécurité. Les chiffres doivent provenir d’une source identifiable et d’une période précise : ne les invente jamais dans une copie.","example":null}],"takeaway":["Efficacité = objectifs atteints","Efficience = résultats / ressources","Équité = répartition des effets"],"questions":[{"text":"Une politique atteint son objectif, mais son coût explose. Quelle appréciation est certaine ?","choices":["Elle peut être efficace sans être efficiente","Elle est nécessairement efficiente","Elle est nécessairement illégale"],"correct":[0],"reason":["Oui, objectif et coût sont deux dimensions distinctes.","Pas forcément : le rapport ressources/résultats peut être mauvais.","Un coût élevé ne prouve pas à lui seul l’illégalité."],"pill":"Efficacité et efficience ne sont pas synonymes.","multi":false},{"text":"Quelle question relève de l’équité ?","choices":["Les bénéfices sont-ils répartis équitablement entre quartiers ?","Combien de formulaires ont été imprimés ?","Combien de jours a duré la réunion ?"],"correct":[0],"reason":["Exact, c’est la distribution des effets.","C’est un moyen ou une réalisation, pas une mesure d’équité.","Une donnée de processus, non d’équité."],"pill":"Équité : qui bénéficie réellement des résultats ?","multi":false},{"text":"Une fréquentation augmente après une réforme. Peut-on prouver immédiatement que la réforme en est la cause ?","choices":["Oui, le calendrier suffit","Non, il faut examiner d’autres facteurs"],"correct":[1],"reason":["Une succession chronologique n’établit pas automatiquement un lien causal.","Oui : le raisonnement doit tester des explications alternatives."],"pill":"Corrélation ≠ causalité.","multi":false},{"text":"Quels indicateurs peuvent aider à évaluer une politique ?","choices":["Coût par bénéficiaire","Effet sur le public cible","Nombre de services ouverts"],"correct":[0,1,2],"reason":["Oui, renseigne notamment l’efficience.","Oui, renseigne l’efficacité ou l’impact.","Oui, renseigne les réalisations, mais ne suffit pas pour l’impact."],"pill":"Associe indicateurs d’intrants, réalisations et résultats.","multi":true}]},{"id":"comptabilite","title":"Comptabilité générale ou analytique ?","subject":"Nouvelle gestion publique","icon":"calculator","semester":"S5","minutes":10,"source":{"file":"64L07TEWB0025_Cours_NouvelleGestionPublique.pdf","pages":"5–8 (introduction et thème 1)"},"sections":[{"title":"1 · Deux manières de regarder l’organisation","body":"La comptabilité générale classe les opérations pour restituer une image d’ensemble, notamment patrimoniale et financière. La comptabilité analytique, ou de gestion, cherche plutôt à comprendre le coût d’une activité, d’un service ou d’un projet. Au lieu de se demander uniquement combien une administration a dépensé en électricité, on cherche à savoir quelles activités ont consommé cette ressource et pour quels résultats. La seconde approche fournit une information de décision, même si le calcul dépend de conventions et d’hypothèses.","example":null},{"title":"2 · Charges directes et indirectes","body":"Une charge directe peut être affectée sans calcul arbitraire à un objet de coût : par exemple, des fournitures acquises exclusivement pour un atelier donné. Une charge indirecte bénéficie à plusieurs activités, comme le chauffage d’un bâtiment partagé ; elle nécessite une clé de répartition. Le choix de cette clé doit être justifié. Une clé simple peut être la surface occupée ou les heures d’utilisation ; elle n’est pas automatiquement la plus fidèle à la réalité.","example":"L’électricité d’un gymnase communal utilisé par plusieurs associations est une charge dont l’affectation exige souvent une méthode de répartition."},{"title":"3 · Centres auxiliaires et principaux","body":"Les centres auxiliaires rendent des prestations aux autres unités de l’organisation (informatique, entretien, administration) ; les centres principaux sont plus directement reliés aux services ou produits finaux. Le coût d’un centre auxiliaire peut être réparti vers les centres principaux selon les prestations fournies. Le calcul devient donc une représentation organisée des flux internes. Une même organisation peut choisir des découpages différents selon la décision à éclairer.","example":null},{"title":"4 · Limites de l’outil","body":"Calculer le coût d’un service public n’équivaut pas à déterminer sa valeur sociale. Un dispositif coûteux peut être indispensable pour assurer l’égalité d’accès ou protéger une population vulnérable. Les gestionnaires doivent donc articuler les coûts avec des objectifs de service public. Dans un exercice, détaille les hypothèses et les unités de mesure, puis interprète le résultat avec prudence.","example":null}],"takeaway":["Générale = vision globale ; analytique = coût par activité","Directe ≠ indirecte","Coût calculé ≠ valeur d’intérêt général"],"questions":[{"text":"Quel outil sert prioritairement à déterminer le coût d’un service ?","choices":["Comptabilité analytique","Registre de l’état civil","Procès-verbal d’élection"],"correct":[0],"reason":["Exact : elle relie charges et activités.","Il remplit une autre fonction.","Sans lien avec l’analyse des coûts."],"pill":"La comptabilité de gestion suit les coûts par destination.","multi":false},{"text":"Le chauffage commun à trois services est plutôt…","choices":["Une charge indirecte","Une charge toujours directe","Une recette fiscale"],"correct":[0],"reason":["Oui, une répartition est nécessaire.","Il n’est pas directement imputable à un seul service.","Le chauffage est une dépense, pas une recette."],"pill":"Charge indirecte : la clé de répartition doit être explicitée.","multi":false},{"text":"Quelles unités peuvent être des centres auxiliaires ?","choices":["Service informatique partagé","Service entretien","Une activité finale que l’on cherche à chiffrer"],"correct":[0,1],"reason":["Oui, prestation interne à plusieurs services.","Oui, prestation interne.","Il s’agit plutôt d’un centre principal."],"pill":"Auxiliaire = support ; principal = activité finale.","multi":true},{"text":"Le service le moins coûteux est-il automatiquement le meilleur ?","choices":["Oui, dans tous les cas","Non, la qualité et l’intérêt général comptent aussi"],"correct":[1],"reason":["Le coût ne résume ni la qualité ni l’équité.","Exact, les objectifs publics sont multidimensionnels."],"pill":"Maîtriser les coûts n’efface pas les finalités du service public.","multi":false}]},{"id":"couts","title":"Un petit calcul de coût public","subject":"Nouvelle gestion publique","icon":"chart","semester":"S5","minutes":10,"source":{"file":"64L07TEWB0025_Cours_NouvelleGestionPublique.pdf","pages":"7–15 (coûts, centres et méthode des coûts)"},"sections":[{"title":"1 · Identifier l’objet de coût","body":"Un calcul doit d’abord répondre à la question « coût de quoi ? » : une séance, un usager, un repas, une filière universitaire, une journée d’ouverture. L’objet de coût détermine les ressources retenues. Changer d’objet sans l’annoncer rend les comparaisons inutilisables. On distingue aussi le coût total (ensemble des charges incluses) du coût unitaire (coût total divisé par le nombre d’unités produites).","example":null},{"title":"2 · Calculer un coût complet simplifié","body":"Supposons qu’une structure organise dix ateliers. Les intervenants coûtent 900 €, les fournitures dédiées 300 € et les charges communes affectées aux ateliers 200 €. Le coût total est 900 + 300 + 200 = 1 400 €. Le coût par atelier est de 1 400 / 10 = 140 €. Si cent participants ont bénéficié des ateliers, le coût moyen par participant est 14 €, mais cet indicateur ne dit rien du résultat pédagogique. Le périmètre des charges doit être décrit pour que le chiffre soit comparable.","example":null},{"title":"3 · Charges fixes et variables","body":"À court terme, certaines charges ne varient pas avec le nombre de bénéficiaires dans l’intervalle considéré : par exemple un loyer mensuel. D’autres varient plus directement avec l’activité, comme des consommables par participant. Cette distinction permet de comprendre que le coût moyen peut baisser lorsque le nombre de participants augmente, à condition que les capacités suffisent. Dans le secteur public, l’objectif n’est pas systématiquement de maximiser un profit : c’est d’utiliser les ressources de façon pertinente pour remplir une mission.","example":null},{"title":"4 · Interpréter une variation","body":"Si les ateliers passent de dix à douze sans hausse des charges fixes, le coût moyen peut diminuer. Mais cela dépend du nombre d’heures des intervenants et des fournitures supplémentaires nécessaires. Un calcul de coût sert à discuter une décision, pas à en apporter une réponse automatique. Avant d’annoncer une économie, vérifie les charges omises, la qualité du service et l’échelle retenue.","example":null}],"takeaway":["Coût unitaire = coût total / nombre d’unités","Une clé d’imputation doit être justifiée","Coût ≠ impact"],"questions":[{"text":"900 € + 300 € + 200 € pour 10 ateliers : coût par atelier ?","choices":["100 €","140 €","1 400 €"],"correct":[1],"reason":["Tu omets une partie des charges.","Oui, total 1 400 €, soit 140 € par atelier.","C’est le coût total, pas unitaire."],"pill":"Coût unitaire = total des charges / unités produites.","multi":false},{"text":"Quel est l’objet de coût dans « coût par participant » ?","choices":["Un participant","Une année budgétaire","Un bâtiment entier"],"correct":[0],"reason":["Oui, l’unité de référence est le participant.","C’est une période et pas l’unité demandée.","Autre objet de coût possible mais différent."],"pill":"Toujours définir précisément « coût de quoi ? ».","multi":false},{"text":"Quelles précautions sont utiles avant une comparaison de coûts ?","choices":["Même périmètre de charges","Même type d’unité","Ignorer systématiquement la qualité"],"correct":[0,1],"reason":["Oui, sinon les données sont incomparables.","Oui, sinon on compare des unités différentes.","La qualité peut expliquer une variation de coût."],"pill":"Une comparaison exige périmètre, méthode et unité cohérents.","multi":true},{"text":"Une charge fixe reste identique…","choices":["À court terme, dans un certain intervalle d’activité","Pour toujours et quelle que soit l’activité"],"correct":[0],"reason":["Correct, la fixité dépend de l’horizon et de la capacité.","Une hausse de capacité peut créer de nouveaux coûts fixes."],"pill":"« Fixe » est relatif à une période et à une échelle d’activité.","multi":false}]},{"id":"agents","title":"Fonctionnaire ou contractuel ?","subject":"Droit de la fonction publique","icon":"briefcase","semester":"S5","minutes":10,"source":{"file":"64L09TEWB0027_Cours_DroitFP.pdf","pages":"12–19 (agents publics, SPA/SPIC, statut)"},"sections":[{"title":"1 · Agent public : une catégorie plus large","body":"Tous les fonctionnaires sont des agents publics, mais tous les agents publics ne sont pas fonctionnaires. Les fonctionnaires sont, en principe, nommés dans un emploi permanent et titularisés dans un grade d’une hiérarchie administrative. Les agents contractuels peuvent être engagés par une personne publique pour accomplir des missions administratives sans bénéficier du même statut de titulaire. L’identification précise de leur régime détermine notamment les règles de recrutement, carrière et contentieux.","example":null},{"title":"2 · SPA et SPIC","body":"La distinction traditionnelle entre service public administratif (SPA) et service public industriel et commercial (SPIC) a des conséquences sur les personnels. Selon la jurisprudence Berkani (Tribunal des conflits, 25 mars 1996), les personnels non statutaires employés par une personne publique pour un SPA relèvent en principe d’un contrat de droit public, quel que soit leur emploi. À l’inverse, les personnels d’un SPIC relèvent en principe du droit privé, sous réserve d’exceptions et de textes spéciaux.","example":"Un agent d’accueil contractuel recruté directement par une collectivité pour un SPA n’est pas nécessairement fonctionnaire : il peut être agent contractuel de droit public."},{"title":"3 · Une situation légale et réglementaire","body":"Le fonctionnaire titulaire est placé dans une situation statutaire : ses droits et obligations sont principalement définis par des normes légales et réglementaires, plutôt que négociés individuellement par contrat de travail privé. Cela ne veut pas dire qu’il n’a aucun droit individuel. L’administration dispose d’un pouvoir hiérarchique, mais doit respecter les garanties statutaires, les procédures et les principes généraux du droit. Il ne faut donc pas confondre « statut » et absence de protection.","example":null},{"title":"4 · La bonne méthode pour un cas","body":"Pour qualifier un agent, ne te contente pas de son intitulé de poste. Vérifie l’employeur, la nature du service, la présence éventuelle d’un statut particulier, la titularisation et l’existence d’un contrat. En présence de dérogations législatives, celles-ci peuvent primer la grille jurisprudentielle générale. Présente ton raisonnement avec prudence si l’énoncé ne donne pas assez de faits.","example":null}],"takeaway":["Fonctionnaire ⊂ agents publics","SPA/ SPIC influencent le régime des personnels","Berkani, TC 25 mars 1996 : personnels non statutaires des SPA publics"],"questions":[{"text":"Tous les agents publics sont-ils fonctionnaires ?","choices":["Oui","Non"],"correct":[1],"reason":["Il existe aussi des agents contractuels publics.","Exact : fonctionnaire est une catégorie particulière."],"pill":"Fonctionnaire = agent titulaire régi par un statut.","multi":false},{"text":"La décision Berkani concerne principalement…","choices":["Les contractuels employés par des personnes publiques dans un SPA","La durée du mandat présidentiel","Le droit de dissolution"],"correct":[0],"reason":["Oui, en principe contrats de droit public.","Ce thème est constitutionnel, sans rapport.","Aucun rapport avec Berkani."],"pill":"Berkani (TC, 25 mars 1996) : personnels non statutaires des SPA gérés par personnes publiques.","multi":false},{"text":"Pour qualifier le régime d’un agent, quels critères examiner ?","choices":["Nature du service","Statut et type de recrutement","Couleur de l’uniforme"],"correct":[0,1],"reason":["Oui, SPA/SPIC est utile.","Oui, titulaire/contractuel et textes spéciaux sont essentiels.","Non, cela ne détermine pas le statut juridique."],"pill":"Raisonne par faits et textes, pas par nom de poste.","multi":true},{"text":"En principe, les personnels ordinaires d’un SPIC relèvent du…","choices":["Droit privé, avec exceptions","Droit constitutionnel uniquement"],"correct":[0],"reason":["Exact : principe de droit privé, hors exceptions.","Ce n’est pas une catégorie pertinente de régime d’emploi."],"pill":"SPIC : principe de droit privé ; SPA : le régime peut être public.","multi":false}]},{"id":"grh","title":"Recrutement, compétences et motivation","subject":"Gestion des ressources humaines","icon":"heart","semester":"S5","minutes":10,"source":{"file":"64L13TEWB0123_Cours_GRHOrganisations.pdf","pages":"5–18 (cadre général, parcours professionnel et satisfaction)"},"sections":[{"title":"1 · Ce que gère la GRH","body":"La gestion des ressources humaines ne se réduit pas à établir des fiches de paie. Elle organise l’adéquation entre les besoins d’une structure et les compétences, conditions de travail et parcours de ses agents. Elle comprend le recrutement, l’accueil, la formation, la mobilité, l’évaluation, la rémunération et la prévention des risques professionnels. Dans le secteur public, elle doit combiner la qualité du service rendu, les contraintes budgétaires et des principes juridiques spécifiques, notamment l’égalité de traitement.","example":null},{"title":"2 · Le parcours professionnel","body":"Un recrutement pertinent part d’un besoin réel et d’une définition précise des missions. L’accueil d’un nouvel agent permet de clarifier les responsabilités et les procédures ; la formation continue permet d’adapter les compétences au fil des évolutions du poste. Les entretiens professionnels servent notamment à échanger sur les résultats, les compétences et les perspectives. Il faut distinguer l’évaluation individuelle du seul calcul des effectifs : la GRH vise aussi le développement des personnes.","example":"Dans un lycée, l’accueil d’un nouvel assistant d’éducation peut associer une présentation des procédures de vie scolaire, des règles de sécurité et du rôle de médiation."},{"title":"3 · Satisfaction et engagement","body":"Les conditions de travail, la reconnaissance, l’autonomie, la relation avec l’encadrement et les perspectives d’évolution peuvent influer sur la satisfaction des agents. Mesurer ce phénomène ne consiste pas seulement à demander « êtes-vous heureux ? ». Il faut croiser des indicateurs quantitatifs (absences, départs, formations) avec un dialogue qualitatif. Un taux d’absentéisme élevé n’explique pas, à lui seul, ses causes : charge de travail, santé, organisation et contexte peuvent intervenir.","example":null},{"title":"4 · Des indicateurs utiles mais limités","body":"Les tableaux de bord sociaux doivent répondre à une question de gestion. Par exemple, le taux d’agents ayant suivi une formation renseigne la diffusion de la formation, mais pas automatiquement l’acquisition des compétences. Un indicateur mal défini conduit à des comparaisons trompeuses. En examen, donne systématiquement le nom de l’indicateur, son mode de calcul, ce qu’il mesure et ce qu’il ne permet pas de conclure.","example":null}],"takeaway":["GRH = compétences + parcours + conditions de travail","Un indicateur quantitatif n’explique pas toujours les causes","Évaluer les compétences ≠ compter seulement les effectifs"],"questions":[{"text":"Quel domaine appartient à la GRH ?","choices":["Formation des agents","Recrutement","Gestion des parcours"],"correct":[0,1,2],"reason":["Oui : développement des compétences.","Oui : adaptation des besoins et profils.","Oui : mobilité, évolution, évaluations."],"pill":"La GRH agit sur tout le parcours professionnel.","multi":true},{"text":"Un taux d’absentéisme élevé prouve-t-il une mauvaise motivation ?","choices":["Oui, sans exception","Non, il faut analyser les causes"],"correct":[1],"reason":["Il existe de multiples facteurs possibles.","Correct : le chiffre seul ne prouve pas sa cause."],"pill":"Une donnée de gestion ne constitue pas à elle seule un diagnostic.","multi":false},{"text":"Quelle action favorise l’intégration d’un nouvel agent ?","choices":["Clarifier missions et procédures","Ne transmettre aucune consigne","Supprimer tous les échanges avec l’équipe"],"correct":[0],"reason":["Oui : l’accueil structure la prise de poste.","L’absence de consignes crée un risque organisationnel.","Le collectif et les échanges favorisent l’intégration."],"pill":"L’intégration fait partie de la qualité du recrutement.","multi":false},{"text":"Le nombre d’heures de formation suffit-il à mesurer les compétences acquises ?","choices":["Oui, obligatoirement","Non, il faut aussi apprécier les acquis"],"correct":[1],"reason":["Le temps suivi ne démontre pas l’apprentissage.","Exact : quantité et effet sont distincts."],"pill":"Mesurer l’activité de formation n’est pas mesurer son efficacité.","multi":false}]}];

</script>
  <script>
/* Capsule AP – prototype autonome. Sans compte, publicité, serveur ni suivi. */
(()=>{'use strict';
const KEY='capsule-ap-progress-v1',PACKKEY='capsule-ap-custom-lessons-v1';
const iconPaths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',library:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',chart:'<path d="M3 3v18h18M8 16v-4m5 4V8m5 8V5"/>',settings:'<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a2 2 0 0 0 .4 2.2l-2.4 2.4a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8h-3.4A2 2 0 0 0 9.4 19a2 2 0 0 0-2.2.4l-2.4-2.4a2 2 0 0 0 .4-2.2A2 2 0 0 0 3.4 13v-2A2 2 0 0 0 5 9.4a2 2 0 0 0-.4-2.2l2.4-2.4a2 2 0 0 0 2.2.4A2 2 0 0 0 10.6 3h3.4a2 2 0 0 0 1.2 1.8 2 2 0 0 0 2.2-.4l2.4 2.4a2 2 0 0 0-.4 2.2A2 2 0 0 0 21 11v2a2 2 0 0 0-1.6 2Z"/>',arrow:'<path d="m9 18 6-6-6-6"/>',back:'<path d="m15 18-6-6 6-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="m4 12 5 5L20 6"/>',spark:'<path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9Z"/>',book:'<path d="M3 6.5C6 5 9 5 12 7c3-2 6-2 9-.5V20c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5Z"/><path d="M12 7v13.5"/>',flag:'<path d="M5 22V3m0 0c4-2 6 2 10 0v11c-4 2-6-2-10 0"/>'};
const I=(id,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[id]||iconPaths.book}</svg>`;
const em={scale:'⚖',book:'▤',landmark:'⌂',gavel:'§',users:'♙',route:'◎',target:'◉',calculator:'∑',chart:'↗',briefcase:'▣',heart:'♡'};
const $=sel=>document.querySelector(sel);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getJson=(key,def)=>{try{const t=JSON.parse(localStorage.getItem(key));return t??def}catch{return def}};
let store=getJson(KEY,{results:{},history:[],notes:{},weak:[]});
if(!store||typeof store!=='object')store={results:{},history:[],notes:{},weak:[]};
store.results ||= {};store.history ||= [];store.notes ||= {};store.weak ||= [];
let custom=getJson(PACKKEY,[]);if(!Array.isArray(custom))custom=[];
let lessons=[...(window.CAPSULE_SEED||[])];
const merge=()=>{const base=[...(window.CAPSULE_SEED||[])];for(const l of custom){const index=base.findIndex(x=>x.id===l.id);if(index>=0)base[index]=l;else base.push(l)}lessons=base};merge();
let view='home',selectedId=null,step='read',questionIndex=0,answer=[],checked=false,score=0,answers=[],filter='Tous',search='',startRead=0,quizRetry=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch{toast('Sauvegarde locale indisponible sur cet appareil.')}}
function showDate(ts){return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}
function current(){return lessons.find(l=>l.id===selectedId)}
function finished(){return Object.keys(store.results).filter(id=>lessons.some(l=>l.id===id)).length}
function stats(){let x=store.history.length;let avg=x?Math.round(store.history.reduce((s,a)=>s+a.percent,0)/x):0;return {done:finished(),attempts:x,avg,weak:store.weak.length}}
function row(l){let result=store.results[l.id];let grade=result?`<span class="row-status done">${I('check',14)} ${result.best}%</span>`:`<span class="row-status">${l.minutes} min ›</span>`;let tint=l.subject==='Droit constitutionnel'?'':l.subject==='Politiques publiques'?'blue':'green';return `<button class="lesson-row" type="button" data-action="open" data-id="${safe(l.id)}"><span class="course-icon ${tint}" aria-hidden="true">${em[l.icon]||'◈'}</span><span class="row-main"><h3>${safe(l.title)}</h3><p>${safe(l.semester)} · ${safe(l.subject)}</p></span>${grade}</button>`}
function brand(){return `<div class="brand"><div class="brand-mark">AP</div>CAPSULE <span class="brand-light">L3 · Administration publique</span></div>`}
function nav(){const items=[['home','Accueil'],['library','Cours'],['chart','Progrès'],['settings','Options']];$('#bottom-nav').innerHTML=items.map(([name,label])=>`<button class="nav-item ${view===name?'active':''}" type="button" data-action="tab" data-view="${name}" ${view===name?'aria-current="page"':''}>${I(name,23)}<span>${label}</span></button>`).join('')}
function home(){let s=stats(),next=lessons.find(l=>!store.results[l.id])||lessons[0];const back=store.history.length?store.history[0]:null;return `<header class="top">${brand()}<div class="hero"><span class="eyebrow">Ton apprentissage, à ton rythme</span><h1>10 minutes.<br><em>Une notion maîtrisée.</em></h1><p>Un extrait de cours, des questions et une explication pour chaque réponse. Sans pression, même entre deux entraînements.</p></div><div class="hero-stats"><span class="stat-pill">${I('book',17)} <strong>${s.done}</strong> / ${lessons.length} leçons</span><span class="stat-pill">${I('chart',17)} <strong>${s.avg}%</strong> moyenne</span></div></header><main class="content"><div class="section-heading"><h2>Ta prochaine capsule</h2><span class="subtle">Lecture + quiz</span></div><section class="feature"><span class="eyebrow">${safe(next.semester)} · ${safe(next.subject)}</span><h3>${safe(next.title)}</h3><p>Lis l’essentiel, réponds à 4 questions puis découvre la théorie derrière chaque solution.</p><div class="feature-actions"><button class="btn btn-white" data-action="open" data-id="${safe(next.id)}">Commencer ${I('arrow',17)}</button><span class="feature-duration">${I('clock',15)} ${next.minutes} min</span></div></section><div class="spacing"></div><div class="section-heading"><h2>À découvrir</h2><button class="filter" data-action="tab" data-view="library">Tout voir →</button></div><div class="list">${lessons.slice(0,5).map(row).join('')}</div><div class="spacing"></div><aside class="muted-card">📚 <strong>Contenu pilote :</strong> ${lessons.length} micro-cours du semestre 5, écrits à partir de tes supports CNED et accompagnés de ${lessons.reduce((a,l)=>a+l.questions.length,0)} questions originales. Les autres matières pourront être ajoutées par des fichiers JSON.</aside><p class="disclaimer">Outil personnel d’entraînement · Pas une application officielle de l’IPAG ou du CNED</p></main>`}
function library(){const filtered=lessons.filter(l=>(filter==='Tous'||l.subject===filter) && ((l.title+' '+l.subject).toLowerCase().includes(search.toLowerCase())));const subs=['Tous',...new Set(lessons.map(l=>l.subject))];return `<header class="inside-top">${brand()}<h1>Bibliothèque</h1><div class="meta">${lessons.length} capsules disponibles · ${finished()} terminées</div></header><main class="content"><label class="search">${I('book',19)}<input type="search" id="lessonSearch" aria-label="Chercher une capsule" value="${safe(search)}" placeholder="Rechercher une matière ou une notion…"></label><div class="filterstrip">${subs.map(s=>`<button class="filter ${filter===s?'on':''}" data-action="filter" data-id="${safe(s)}">${safe(s)}</button>`).join('')}</div><div class="list">${filtered.length?filtered.map(row).join(''):'<p class="empty">Aucune capsule correspondante.</p>'}</div></main>`}
function topLesson(l,sub){return `<header class="inside-top"><button class="back" type="button" data-action="tab" data-view="library">${I('back',18)} Bibliothèque</button><h1>${safe(l.title)}</h1><div class="meta"><span class="crumb">${safe(l.semester)}</span>${safe(l.subject)} · ${safe(sub)}</div></header>`}
function read(l){return `${topLesson(l,'cours synthétisé')}<main class="content reader"><div class="reading-timer"><div><b style="font-size:13px">Ton rituel de lecture</b><p>10 minutes environ, avec reformulation des notions.</p></div><span class="timer" id="readingClock" role="timer">00:00</span></div>${l.sections.map(x=>`<section class="reader-section"><h2>${safe(x.title)}</h2><p>${safe(x.body)}</p>${x.example?`<div class="example"><b>Exemple concret</b><br>${safe(x.example)}</div>`:''}</section>`).join('')}<section class="focus-card"><h3>À retenir sans regarder le cours</h3><ul>${l.takeaway.map(s=>`<li>${safe(s)}</li>`).join('')}</ul></section><div class="source"><b>Source de référence (PDF du dossier CNED)</b>${safe(l.source.file)} · p. ${safe(l.source.pages)}<br><span class="tiny">Capsule rédigée pour l’entraînement, non issue mot à mot du support officiel.</span></div><label style="display:block;font-size:13px;font-weight:800;margin:17px 0 7px" for="note">Ma note personnelle / ce que j’ai compris</label><textarea id="note" class="note-area" placeholder="Ex. : Ce qu’il faut surtout retenir…">${safe(store.notes[l.id]||'')}</textarea><div style="margin:10px 0 18px"><button data-action="save-note" class="btn btn-outline">Enregistrer ma note</button></div><button class="btn btn-dark btn-block" type="button" data-action="start-quiz">J’ai terminé ma lecture → 4 questions ${I('arrow',17)}</button></main>`}
function isRight(q,sel){let a=[...sel].sort().join(','),b=[...q.correct].sort().join(',');return a===b}
function qView(l){let q=l.questions[questionIndex];const progress=100*(questionIndex+1)/l.questions.length;const opts=q.choices.map((choice,i)=>{let selected=answer.includes(i),right=q.correct.includes(i);return `<button class="option ${checked?(right?'correct':selected?'wrong':''):selected?'selected':''}" type="button" data-action="choice" data-idx="${i}" aria-pressed="${selected}" ${checked?'disabled':''}><span class="bubble">${checked&&right?'✓':selected?'✓':''}</span><span>${safe(choice)}</span></button>`}).join('');let details='';if(checked){const right=isRight(q,answer);details=`<section class="feedback" aria-live="polite"><h3>${right?'✓ Bonne réponse !':'↗ À consolider'}</h3><p>${right?'Ton raisonnement est juste.':`Bonne${q.correct.length>1?'s':''} réponse${q.correct.length>1?'s':''} : ${q.correct.map(i=>safe(q.choices[i])).join(' · ')}.`}</p>${q.choices.map((c,i)=>`<div class="feedback-item"><span class="mini-label">${q.correct.includes(i)?'✓ Réponse juste':'Pourquoi cette option ne convient pas'}${answer.includes(i)?' · ton choix':''}</span><p style="margin:0">${safe(q.reason[i])}</p></div>`).join('')}<div class="pill-theory"><strong>✦ LA PILULE DE THÉORIE</strong>${safe(q.pill)}</div></section>`}
return `${topLesson(l,'quiz interactif')}<main class="content"><div class="quiztop"><span>Question ${questionIndex+1} sur ${l.questions.length}</span><span>${checked?(isRight(q,answer)?'✓ Validée':'À revoir'):(q.multi?'Plusieurs réponses':'Une seule réponse')}</span></div><div class="progress-bar" aria-label="Progression du quiz"><span style="width:${progress}%"></span></div><h2 class="question">${safe(q.text)}</h2><p class="hint">${q.multi?'Coche toutes les bonnes réponses.':'Choisis la meilleure réponse.'}</p><div class="options" role="group" aria-label="Choix de réponse">${opts}</div>${details}${checked?`<button type="button" class="btn btn-dark btn-block" data-action="next">${questionIndex+1===l.questions.length?'Voir mon bilan':'Question suivante'} ${I('arrow',17)}</button>`:`<button type="button" class="btn btn-dark btn-block" data-action="verify" ${answer.length?'':'disabled'}>Vérifier et comprendre ${I('check',16)}</button>`}<div class="spacing"></div><button class="btn btn-outline btn-block" data-action="read-again">Revoir le cours</button></main>`}
function result(l){let percent=Math.round(score/l.questions.length*100);let fails=answers.filter(x=>!x.ok).length;return `${topLesson(l,'bilan de séance')}<main class="content"><section class="score"><div class="score-circle">${score}/${l.questions.length}</div><h2>${percent===100?'Parfait, capsule maîtrisée !':percent>=75?'Très bon travail !':percent>=50?'Tu progresses !':'C’est en répétant qu’on apprend.'}</h2><p>Tu as obtenu <b>${percent}%</b> à ce quiz.<br>${fails?`${fails} question${fails>1?'s':''} à retravailler.`:'Toutes les questions ont été validées.'} Ta progression est enregistrée sur cet appareil.</p><small>Répondre puis comprendre : c’est le principe de Capsule AP.</small></section><div class="focus-card"><h3>Les trois idées clés</h3><ul>${l.takeaway.map(s=>`<li>${safe(s)}</li>`).join('')}</ul></div><div class="quick-actions"><button type="button" class="btn btn-outline" data-action="read-again">Relire</button><button type="button" class="btn btn-dark" data-action="retry">Refaire le quiz</button></div><div class="spacing"></div><button type="button" class="btn btn-lime btn-block" data-action="tab" data-view="home">Retour à l’accueil ${I('arrow',17)}</button></main>`}
function dashboard(){const s=stats();return `<header class="inside-top">${brand()}<h1>Ta progression</h1><div class="meta">Toutes les données restent sur cet appareil.</div></header><main class="content"><div class="metrics"><div class="metric"><b>${s.done}/${lessons.length}</b><p>Capsules effectuées</p></div><div class="metric"><b>${s.avg}%</b><p>Moyenne des tentatives</p></div><div class="metric"><b>${s.attempts}</b><p>Quiz terminés</p></div><div class="metric"><b>${s.weak}</b><p>Questions à revoir</p></div></div><div class="spacing"></div>${s.weak?`<div class="section-heading"><h2>À revoir</h2></div><div class="list">${[...new Set(store.weak.map(k=>k.split('::')[0]))].map(id=>lessons.find(l=>l.id===id)).filter(Boolean).map(row).join('')}</div><div class="spacing"></div>`:''}<div class="section-heading"><h2>Dernières séances</h2></div>${s.attempts?store.history.slice(0,12).map(h=>`<div class="history"><span><strong>${safe(lessons.find(l=>l.id===h.id)?.title||h.id)}</strong><br><span class="tiny">${showDate(h.at)}</span></span><b>${h.percent}%</b></div>`).join(''):'<p class="empty">Ta première séance apparaîtra ici.</p>'}<div class="spacing"></div><button class="btn btn-outline btn-block" data-action="export-progress">Exporter ma progression ${I('arrow',16)}</button></main>`}
function settings(){return `<header class="inside-top">${brand()}<h1>Personnalisation</h1><div class="meta">Pour faire évoluer ton application pendant la L3.</div></header><main class="content"><section class="entry"><h3>Ajouter de nouvelles capsules</h3><p>Lorsque tu recevras des cours du S6 ou des entraînements supplémentaires, importe un fichier JSON compatible. Les anciennes capsules sont conservées ; un identifiant identique met à jour la capsule correspondante.</p><input id="import-file" type="file" accept=".json,application/json" style="font-size:12px;max-width:100%;margin-bottom:13px"><button class="btn btn-dark btn-block" data-action="import">Importer les capsules</button><div class="spacing" style="height:12px"></div><button class="btn btn-outline btn-block" data-action="template">Télécharger un exemple JSON</button></section><section class="entry"><h3>Sauvegarder ton travail</h3><p>Les scores, la liste des erreurs et tes notes sont stockés localement sur ce navigateur. Ils ne se synchronisent pas automatiquement entre appareils. Exporte une sauvegarde avant de changer d’iPhone.</p><div class="quick-actions"><button class="btn btn-outline" data-action="export-progress">Exporter</button><button class="btn btn-outline" data-action="import-progress">Importer</button></div><input type="file" id="import-progress" accept=".json,application/json" hidden></section><section class="entry"><h3>Installation sur iPhone</h3><p>Une fois ce dossier publié sur un site HTTPS : ouvre le lien dans <strong>Safari → Partager → Sur l’écran d’accueil → Ouvrir comme app web → Ajouter</strong>. Les contenus inclus fonctionneront ensuite hors connexion après leur premier chargement.</p><div class="alert">Le fichier HTML téléchargé peut servir de démonstration sur ordinateur. Pour un usage confortable sur iPhone et l’installation hors ligne, publie le dossier sur un hébergeur HTTPS.</div></section><section class="entry"><h3>À propos</h3><p>Prototype d’entraînement personnel L3 Administration publique, réalisé à partir de synthèses originales de supports CNED 2026‑2027. Les exercices sont des créations de révision, non des sujets officiels.</p><p>Pour les examens, consulte toujours les polycopiés et les consignes de l’IPAG ; le contenu peut être simplifié et ne remplace pas les sources officielles.</p></section><p class="disclaimer">Capsule AP · Version 1.0 · Aucun serveur ni collecte de données</p></main>`}
function render(){const el=$('#app');if(view==='home')el.innerHTML=home();else if(view==='library')el.innerHTML=library();else if(view==='chart')el.innerHTML=dashboard();else if(view==='settings')el.innerHTML=settings();else if(view==='lesson'){const l=current();if(!l){view='home';return render()}el.innerHTML=step==='read'?read(l):step==='quiz'?qView(l):result(l)}nav();if(view==='lesson'&&step==='read')drawClock();}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
function toast(str){document.querySelector('.notice')?.remove();const x=document.createElement('div');x.className='notice';x.textContent=str;document.body.appendChild(x);setTimeout(()=>x.remove(),3700)}
function open(id){if(!lessons.some(l=>l.id===id))return;selectedId=id;view='lesson';step='read';startRead=Date.now();render();scrollTop()}
function startQuiz(){step='quiz';questionIndex=0;answer=[];checked=false;score=0;answers=[];render();scrollTop()}
function next(){if(questionIndex+1<current().questions.length){questionIndex++;checked=false;answer=[];render();scrollTop();return}let l=current(),pct=Math.round(score/l.questions.length*100),prev=store.results[l.id];store.results[l.id]={best:Math.max(pct,prev?.best||0),last:pct,at:Date.now(),attempts:(prev?.attempts||0)+1};store.history.unshift({id:l.id,percent:pct,at:Date.now()});store.history=store.history.slice(0,100);save();step='result';render();scrollTop()}
function verify(){const q=current()?.questions[questionIndex];if(!q||!answer.length||checked)return;checked=true;let ok=isRight(q,answer),qid=`${selectedId}::${questionIndex}`;if(ok){score++;store.weak=store.weak.filter(x=>x!==qid)}else if(!store.weak.includes(qid))store.weak.push(qid);answers.push({ok,idx:questionIndex,chosen:[...answer]});save();render();scrollTop()}
function downloadFile(filename,str,mime='application/json'){const blob=new Blob([str],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function isLesson(l){return l&&typeof l.id==='string'&&/^[a-z0-9_-]{2,60}$/i.test(l.id)&&typeof l.title==='string'&&typeof l.subject==='string'&&['S5','S6'].includes(l.semester)&&Array.isArray(l.sections)&&l.sections.length>=1&&l.sections.every(x=>typeof x.title==='string'&&typeof x.body==='string')&&Array.isArray(l.takeaway)&&l.takeaway.every(x=>typeof x==='string')&&Array.isArray(l.questions)&&l.questions.length>=1&&l.questions.every(q=>typeof q.text==='string'&&Array.isArray(q.choices)&&q.choices.length>=2&&q.choices.every(x=>typeof x==='string')&&Array.isArray(q.correct)&&q.correct.length>=1&&q.correct.every(i=>Number.isInteger(i)&&i>=0&&i<q.choices.length)&&Array.isArray(q.reason)&&q.reason.length===q.choices.length&&q.reason.every(x=>typeof x==='string')&&typeof q.pill==='string')&&l.source&&typeof l.source.file==='string'&&typeof l.source.pages==='string'}
async function doImport(input,kind){const file=input?.files?.[0];if(!file){toast('Choisis d’abord un fichier JSON.');return}try{if(file.size>2e6)throw Error('Fichier trop volumineux (maximum 2 Mo).');const data=JSON.parse(await file.text());if(kind==='progress'){if(!data||!data.results||!Array.isArray(data.history)||!Array.isArray(data.weak))throw Error('Sauvegarde de progression non reconnue.');store={results:data.results,history:data.history,weak:data.weak,notes:data.notes||{}};save();toast('Progression restaurée.');view='chart';render();return}const items=Array.isArray(data)?data:data.lessons;if(!Array.isArray(items)||!items.length||items.length>100||!items.every(isLesson))throw Error('Le contenu ne correspond pas au modèle de capsules.');for(const l of items){const index=custom.findIndex(x=>x.id===l.id);if(index>=0)custom[index]=l;else custom.push(l)}localStorage.setItem(PACKKEY,JSON.stringify(custom));merge();filter='Tous';view='library';search='';render();toast(`${items.length} capsule(s) importée(s).`)}catch(e){toast('Importation impossible : '+e.message)}}
function drawClock(){const timer=$('#readingClock');if(!timer)return;const seconds=Math.floor((Date.now()-startRead)/1000),min=String(Math.floor(seconds/60)).padStart(2,'0'),sec=String(seconds%60).padStart(2,'0');timer.textContent=`${min}:${sec}`}
setInterval(()=>{if(view==='lesson'&&step==='read')drawClock()},1000);
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;const action=t.dataset.action;switch(action){case'tab':view=t.dataset.view;render();scrollTop();break;case'open':open(t.dataset.id);break;case'filter':filter=t.dataset.id;render();break;case'start-quiz':startQuiz();break;case'choice':if(checked)break;const n=Number(t.dataset.idx),q=current().questions[questionIndex];answer=q.multi?answer.includes(n)?answer.filter(x=>x!==n):[...answer,n]:[n];render();break;case'verify':verify();break;case'next':next();break;case'read-again':step='read';startRead=Date.now();render();scrollTop();break;case'retry':startQuiz();break;case'save-note':store.notes[selectedId]=$('#note')?.value||'';save();toast('Note enregistrée sur cet appareil.');break;case'export-progress':downloadFile('capsule-ap-ma-progression.json',JSON.stringify(store,null,2));break;case'template':downloadFile('capsule-ap-exemple-capsule.json',JSON.stringify({lessons:[lessons[0]]},null,2));break;case'import':doImport($('#import-file'),'content');break;case'import-progress':$('#import-progress')?.click();break;}});
document.addEventListener('input',e=>{if(e.target?.id==='lessonSearch'){search=e.target.value;const pos=e.target.selectionStart;const focused=document.activeElement===e.target;render();if(focused){const el=$('#lessonSearch');el?.focus();el?.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{if(e.target.id==='import-progress')doImport(e.target,'progress')});
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
render();
})();

</script>
</body>
</html>
